name: Deploy to BT Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'   # 使用 LTS 版本，与项目要求的 ^20.19.0 或 >=22.12.0 匹配

      - name: Install dependencies
        run: |
          cd blog
          npm install

      - name: Build project
        run: |
          cd blog
          npm run build   # 生成 blog/dist/ 目录

      - name: Deploy to server
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SERVER_IP }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          SOURCE: 'blog/dist/'          # 只传输构建后的静态文件
          TARGET: ${{ secrets.SERVER_PATH }}   # 即 /www/wwwroot/118.31.108.2/
          ARGS: '-avzr --delete'

      - name: Fix permissions
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo chown -R www:www ${{ secrets.SERVER_PATH }}
            sudo find ${{ secrets.SERVER_PATH }} -type d -exec chmod 755 {} \;
            sudo find ${{ secrets.SERVER_PATH }} -type f -exec chmod 644 {} \;